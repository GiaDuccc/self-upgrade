<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png?v=round" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Self Upgrade" />
    <meta name="theme-color" content="#18181b" />
    <title>Self Upgrade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var s = localStorage.getItem('app_settings');
        if (s && JSON.parse(s).theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
    <style id="init-skeleton-style">
      :root {
        --sk-init-bg: #FAF7F2;
        --sk-init-surface: #FFFDF9;
        --sk-init-border: #222220;
        --sk-init-border-subtle: #D6D1C7;
        --sk-init-base: #EBE7E0;
        --sk-init-mid: #F3F0EA;
        --sk-init-high: #FFFDF9;
      }
      [data-theme='dark'] {
        --sk-init-bg: #121211;
        --sk-init-surface: #1B1A18;
        --sk-init-border: #EDE9E1;
        --sk-init-border-subtle: #383632;
        --sk-init-base: #21201D;
        --sk-init-mid: #292824;
        --sk-init-high: #33312C;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--sk-init-bg);
        font-family: 'JetBrains Mono', monospace;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes sk-init-anim {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .sk-init-shimmer {
        background: linear-gradient(
          90deg,
          var(--sk-init-base) 0%,
          var(--sk-init-mid) 25%,
          var(--sk-init-high) 50%,
          var(--sk-init-mid) 75%,
          var(--sk-init-base) 100%
        );
        background-size: 200% 100%;
        animation: sk-init-anim 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        display: block;
        border-radius: 6px;
      }
      /* Top Navbar: Kích thước 1:1 */
      .sk-init-nav {
        background-color: var(--sk-init-bg);
        border-bottom: 1.5px solid var(--sk-init-border);
        padding: 12px 78px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-sizing: border-box;
      }
      .sk-init-nav-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        gap: 16px;
      }
      /* Main Container: 1650px chuẩn xác tuyệt đối */
      .sk-init-main {
        max-width: 1650px;
        margin: 0 auto;
        padding: 24px 36px 56px;
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      /* Bố cục Dashboard Split 580px minmax(0, 1fr) */
      .sk-init-dash-split {
        display: grid;
        grid-template-columns: 580px minmax(0, 1fr);
        gap: 24px;
        align-items: flex-start;
        width: 100%;
      }
      /* Bố cục DayDetail Split 460px minmax(0, 1fr) */
      .sk-init-day-split {
        display: grid;
        grid-template-columns: 460px minmax(0, 1fr);
        gap: 24px;
        align-items: flex-start;
        width: 100%;
      }
      .sk-init-stat-card {
        background-color: var(--sk-init-surface);
        border: 1px solid var(--sk-init-border);
        border-radius: 10px;
        padding: 16px 18px;
        min-height: 122px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
      }
      .sk-init-chart-box {
        background-color: var(--sk-init-surface);
        border: 1px solid var(--sk-init-border);
        border-radius: 10px;
        padding: 18px 20px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .sk-init-days-section {
        background-color: var(--sk-init-surface);
        border: 1px solid var(--sk-init-border);
        border-radius: 14px;
        padding: 22px;
        box-sizing: border-box;
        width: 100%;
      }
      .sk-init-days-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(134px, 1fr));
        gap: 10px;
        margin-top: 16px;
      }
      .sk-init-day-cell {
        background-color: var(--sk-init-bg);
        border: 1px solid var(--sk-init-border-subtle);
        border-radius: 10px;
        padding: 12px;
        min-height: 102px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
      }
      .sk-init-frame {
        background-color: var(--sk-init-surface);
        border: 1.5px solid var(--sk-init-border);
        border-radius: 14px;
        padding: 22px 24px;
        box-sizing: border-box;
      }
      /* Auth Skeleton 1:1 cho /sign-in, /sign-up, /verify-email */
      .sk-init-auth-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        box-sizing: border-box;
      }
      .sk-init-auth-card {
        width: 100%;
        max-width: 460px;
        background-color: var(--sk-init-surface);
        border: 1.5px solid var(--sk-init-border);
        border-radius: 12px;
        padding: 32px 28px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 24px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.08);
      }
      @media (max-width: 1180px) {
        .sk-init-nav { padding: 12px 24px; }
        .sk-init-main { padding: 16px 20px 40px; }
        .sk-init-dash-split,
        .sk-init-day-split { grid-template-columns: 1fr; gap: 20px; }
      }
    </style>
  </head>

        <!-- VIEW 2: DAY DETAIL SKELETON (Khi người dùng mở trực tiếp /day/YYYY-MM-DD hoặc F5) -->
        <div id="sk-init-day-view" class="sk-init-day-split" style="display: none;">
          <!-- Cột trái: 460px -->
          <div class="sk-init-frame" style="display: flex; flex-direction: column; gap: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="sk-init-shimmer" style="width: 32px; height: 32px; border-radius: 6px;"></span>
                <span class="sk-init-shimmer" style="width: 90px; height: 24px;"></span>
                <span class="sk-init-shimmer" style="width: 32px; height: 32px; border-radius: 6px;"></span>
              </div>
              <div style="display: flex; gap: 6px;">
                <span class="sk-init-shimmer" style="width: 95px; height: 24px; border-radius: 4px;"></span>
                <span class="sk-init-shimmer" style="width: 65px; height: 24px; border-radius: 4px;"></span>
              </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 4px;">
              <span class="sk-init-shimmer" style="width: 220px; height: 26px;"></span>
              <span class="sk-init-shimmer" style="width: 360px; height: 14px;"></span>
            </div>

            <div class="sk-init-stat-card" style="min-height: 365px; background-color: var(--sk-init-base);">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; flex-direction: column; gap: 6px;">
                  <span class="sk-init-shimmer" style="width: 115px; height: 12px;"></span>
                  <div style="display: flex; gap: 12px; align-items: center;">
                    <span class="sk-init-shimmer" style="width: 105px; height: 46px;"></span>
                    <span class="sk-init-shimmer" style="width: 95px; height: 24px; border-radius: 999px;"></span>
                  </div>
                  <span class="sk-init-shimmer" style="width: 165px; height: 13px;"></span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end;">
                  <span class="sk-init-shimmer" style="width: 50px; height: 12px;"></span>
                  <span class="sk-init-shimmer" style="width: 90px; height: 26px; border-radius: 6px;"></span>
                </div>
              </div>

              <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                <span class="sk-init-shimmer" style="height: 52px; border-radius: 6px;"></span>
                <span class="sk-init-shimmer" style="height: 52px; border-radius: 6px;"></span>
                <span class="sk-init-shimmer" style="height: 52px; border-radius: 6px;"></span>
              </div>

              <span class="sk-init-shimmer" style="width: 100%; height: 36px; border-radius: 6px;"></span>
              <span class="sk-init-shimmer" style="width: 100%; height: 8px; border-radius: 999px;"></span>

              <div style="display: flex; gap: 8px;">
                <span class="sk-init-shimmer" style="width: 100px; height: 34px; border-radius: 6px;"></span>
                <span class="sk-init-shimmer" style="width: 95px; height: 34px; border-radius: 6px;"></span>
                <span class="sk-init-shimmer" style="width: 105px; height: 34px; border-radius: 6px;"></span>
              </div>
            </div>
          </div>

          <!-- Cột phải: Timetable Matrix 1:1 -->
          <div class="sk-init-frame" style="display: flex; flex-direction: column; gap: 16px;">
            <div style="display: flex; gap: 10px;">
              <span class="sk-init-shimmer" style="width: 140px; height: 38px; border-radius: 6px;"></span>
              <span class="sk-init-shimmer" style="width: 165px; height: 38px; border-radius: 6px;"></span>
              <span class="sk-init-shimmer" style="width: 140px; height: 38px; border-radius: 6px;"></span>
            </div>

            <span class="sk-init-shimmer" style="width: 100%; height: 380px; border-radius: 10px;"></span>
            <span class="sk-init-shimmer" style="width: 100%; height: 148px; border-radius: 10px;"></span>
          </div>
        </div>
      </main>

      <!-- VIEW 3: AUTH SKELETON 1:1 (Khi mở trực tiếp /sign-in, /sign-up, /verify-email) -->
      <div id="sk-init-auth-view" class="sk-init-auth-shell" style="display: none;" aria-hidden="true">
        <div class="sk-init-auth-card">
          <!-- Banner thông báo kết nối -->
          <div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 6px; background-color: var(--sk-init-base);">
            <span class="sk-init-shimmer" style="width: 8px; height: 8px; border-radius: 50%;"></span>
            <span class="sk-init-shimmer" style="width: 260px; height: 12px;"></span>
          </div>

          <div style="display: flex; align-items: center; gap: 14px; padding-bottom: 18px; border-bottom: 1px solid var(--sk-init-border-subtle);">
            <span class="sk-init-shimmer" style="width: 48px; height: 48px; border-radius: 50%;"></span>
            <div style="display: flex; flex-direction: column; gap: 6px; flex: 1;">
              <span id="sk-init-auth-title" class="sk-init-shimmer" style="width: 160px; height: 24px;"></span>
              <span class="sk-init-shimmer" style="width: 100%; height: 13px;"></span>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 18px;">
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <span class="sk-init-shimmer" style="width: 110px; height: 13px;"></span>
              <span class="sk-init-shimmer" style="width: 100%; height: 44px; border-radius: 8px;"></span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <span class="sk-init-shimmer" style="width: 130px; height: 13px;"></span>
              <span class="sk-init-shimmer" style="width: 100%; height: 44px; border-radius: 8px;"></span>
            </div>
            <div id="sk-init-auth-confirm" style="display: none; flex-direction: column; gap: 6px;">
              <span class="sk-init-shimmer" style="width: 160px; height: 13px;"></span>
              <span class="sk-init-shimmer" style="width: 100%; height: 44px; border-radius: 8px;"></span>
            </div>
            <span class="sk-init-shimmer" style="width: 100%; height: 46px; border-radius: 8px; margin-top: 6px;"></span>
          </div>

          <div style="display: flex; justify-content: center;">
            <span class="sk-init-shimmer" style="width: 200px; height: 14px;"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Script tự động hiển thị skeleton tương ứng theo route trước khi React mount -->
    <script>
      try {
        var p = window.location.pathname;
        if (p.indexOf('/sign-in') !== -1 || p.indexOf('/sign-up') !== -1 || p.indexOf('/verify-email') !== -1) {
          var navEl = document.querySelector('.sk-init-nav');
          var mainEl = document.querySelector('.sk-init-main');
          var authEl = document.getElementById('sk-init-auth-view');
          if (navEl) navEl.style.display = 'none';
          if (mainEl) mainEl.style.display = 'none';
          if (authEl) {
            authEl.style.display = 'flex';
            if (p.indexOf('/sign-up') !== -1) {
              var cfm = document.getElementById('sk-init-auth-confirm');
              var titleEl = document.getElementById('sk-init-auth-title');
              if (cfm) cfm.style.display = 'flex';
              if (titleEl) titleEl.style.width = '200px';
            }
          }
        } else if (p.indexOf('/day') !== -1) {
          var dashEl = document.getElementById('sk-init-dashboard-view');
          var dayEl = document.getElementById('sk-init-day-view');
          if (dashEl && dayEl) {
            dashEl.style.display = 'none';
            dayEl.style.display = 'grid';
          }
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
