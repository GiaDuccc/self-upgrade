<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png?v=square" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Self Upgrade" />
    <meta name="theme-color" content="#18181b" />
    <title>Self Upgrade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var s = localStorage.getItem('app_settings');
        if (s && JSON.parse(s).theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
    <style id="init-skeleton-style">
      :root {
        --sk-init-bg: #FAF7F2;
        --sk-init-surface: #FFFDF9;
        --sk-init-border: #222220;
        --sk-init-border-subtle: #D6D1C7;
        --sk-init-base: #EBE7E0;
        --sk-init-mid: #F3F0EA;
        --sk-init-high: #FFFDF9;
      }
      [data-theme='dark'] {
        --sk-init-bg: #121211;
        --sk-init-surface: #1B1A18;
        --sk-init-border: #EDE9E1;
        --sk-init-border-subtle: #383632;
        --sk-init-base: #21201D;
        --sk-init-mid: #292824;
        --sk-init-high: #33312C;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--sk-init-bg);
        font-family: 'JetBrains Mono', monospace;
        -webkit-font-smoothing: antialiased;
      }
      /* ASCII DITHER SKELETON (ascii-reveal) - THAY THẾ TOÀN BỘ GRADIENT MOTION SHIMMER CŨ */
      :root {
        --ascii-skeleton: #5C5A55;
        --ascii-accent: #222220;
      }
      [data-theme='dark'] {
        --ascii-skeleton: #6E6B62;
        --ascii-accent: #EDE9E1;
      }
      .sk-init-shimmer {
        position: relative;
        display: block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        white-space: pre;
        color: var(--ascii-skeleton);
        background-color: var(--sk-init-surface);
        border: 1px solid var(--sk-init-border-subtle);
        border-radius: 6px;
        overflow: hidden;
        user-select: none;
        pointer-events: none;
        contain: inline-size layout paint style;
        box-sizing: border-box;
      }
      @keyframes sk-ascii-wave {
        0%, 100% {
          opacity: 0.42;
          filter: brightness(0.92);
        }
        50% {
          opacity: 0.95;
          filter: brightness(1.22);
        }
      }
      .sk-init-shimmer {
        animation: sk-ascii-wave 1.8s ease-in-out infinite;
      }
      /* Top Navbar: Kích thước 1:1 */
      .sk-init-nav {
        background-color: var(--sk-init-bg);
        border-bottom: 1.5px solid var(--sk-init-border);
        padding: 12px 78px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-sizing: border-box;
      }
      .sk-init-nav-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        gap: 16px;
      }
      /* Main Container: 1650px chuẩn xác tuyệt đối */
      .sk-init-main {
        max-width: 1650px;
        margin: 0 auto;
        padding: 24px 36px 56px;
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      /* Bố cục Dashboard Split 580px minmax(0, 1fr) */
      .sk-init-dash-split {
        display: grid;
        grid-template-columns: 580px minmax(0, 1fr);
        gap: 24px;
        align-items: flex-start;
        width: 100%;
      }
      /* Bố cục DayDetail Split 460px minmax(0, 1fr) */
      .sk-init-day-split {
        display: grid;
        grid-template-columns: 460px minmax(0, 1fr);
        gap: 24px;
        align-items: flex-start;
        width: 100%;
      }
      .sk-init-stat-card {
        background-color: var(--sk-init-surface);
        border: 1px solid var(--sk-init-border);
        border-radius: 10px;
        padding: 16px 18px;
        min-height: 122px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
      }
      .sk-init-chart-box {
        background-color: var(--sk-init-surface);
        border: 1px solid var(--sk-init-border);
        border-radius: 10px;
        padding: 18px 20px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .sk-init-days-section {
        background-color: var(--sk-init-surface);
        border: 1px solid var(--sk-init-border);
        border-radius: 14px;
        padding: 22px;
        box-sizing: border-box;
        width: 100%;
      }
      .sk-init-days-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(134px, 1fr));
        gap: 10px;
        margin-top: 16px;
      }
      .sk-init-day-cell {
        background-color: var(--sk-init-bg);
        border: 1px solid var(--sk-init-border-subtle);
        border-radius: 10px;
        padding: 12px;
        min-height: 102px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
      }
      .sk-init-frame {
        background-color: var(--sk-init-surface);
        border: 1.5px solid var(--sk-init-border);
        border-radius: 14px;
        padding: 22px 24px;
        box-sizing: border-box;
      }
      /* Auth Skeleton 1:1 cho /sign-in, /sign-up, /verify-email */
      .sk-init-auth-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        box-sizing: border-box;
      }
      .sk-init-auth-card {
        width: 100%;
        max-width: 460px;
        background-color: var(--sk-init-surface);
        border: 1.5px solid var(--sk-init-border);
        border-radius: 12px;
        padding: 32px 28px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 24px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.08);
      }
            /* Landing Skeleton 1:1 cho trang / và /landing */
      .sk-init-landing-shell {
        min-height: 100vh;
        width: 100%;
        display: none;
        flex-direction: column;
        box-sizing: border-box;
      }
      .sk-init-landing-nav {
        height: 64px;
        border-bottom: 1px solid var(--sk-init-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(20px, 4vw, 48px);
        box-sizing: border-box;
      }
      .sk-init-landing-hero {
        padding: 64px 20px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-sizing: border-box;
      }
      .sk-init-landing-grid {
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px 20px 60px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 16px;
        width: 100%;
        box-sizing: border-box;
      }
      .sk-init-landing-card {
        background-color: var(--sk-init-surface);
        border: 1px solid var(--sk-init-border);
        border-radius: 12px;
        padding: 24px;
        min-height: 190px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
      }
@media (max-width: 1180px) {
        .sk-init-nav { padding: 12px 24px; }
        .sk-init-main { padding: 16px 20px 40px; }
        .sk-init-dash-split,
        .sk-init-day-split { grid-template-columns: 1fr; gap: 20px; }
      }
    </style>
  </head>

<!-- Script tự động hiển thị skeleton tương ứng theo route trước khi React mount -->
    <script>
      try {
        var p = window.location.pathname;
        var navEl = document.querySelector('.sk-init-nav');
        var mainEl = document.querySelector('.sk-init-main');
        var authEl = document.getElementById('sk-init-auth-view');
        var landingEl = document.getElementById('sk-init-landing-view');
        var dashEl = document.getElementById('sk-init-dashboard-view');
        var dayEl = document.getElementById('sk-init-day-view');
        var token = null;
        try { token = localStorage.getItem('accessTokenClient'); } catch (err) {}

        if (p.indexOf('/sign-in') !== -1 || p.indexOf('/sign-up') !== -1 || p.indexOf('/verify-email') !== -1) {
          if (token) {
            if (dashEl) dashEl.style.display = 'grid';
          } else {
            if (navEl) navEl.style.display = 'none';
            if (mainEl) mainEl.style.display = 'none';
            if (authEl) {
              authEl.style.display = 'flex';
              if (p.indexOf('/sign-up') !== -1) {
                var cfm = document.getElementById('sk-init-auth-confirm');
                var titleEl = document.getElementById('sk-init-auth-title');
                if (cfm) cfm.style.display = 'flex';
                if (titleEl) titleEl.style.width = '200px';
              }
            }
          }
        } else if (p.indexOf('/day') !== -1) {
          if (dashEl && dayEl) {
            dashEl.style.display = 'none';
            dayEl.style.display = 'grid';
          }
        } else if (p === '/' || p.indexOf('/landing') !== -1) {
          if (token) {
            if (dashEl) dashEl.style.display = 'grid';
          } else {
            if (navEl) navEl.style.display = 'none';
            if (mainEl) mainEl.style.display = 'none';
            if (landingEl) landingEl.style.display = 'flex';
          }
        } else if (p.indexOf('/tong-quan-thang') !== -1 || p.indexOf('/dashboard') !== -1) {
          if (dashEl) dashEl.style.display = 'grid';
        }

        // Tự động chèn ma trận ASCII Dither vào toàn bộ skeleton pre-mount
        var glyphRows = [
          '░░░░▒░░░░░░░▒▒░░░▒░░░░░░░▒░░░░░░░░░▒░░░░░░░▒░░░░░░░░░░░░░░▒░▒▒░░▒░▒░░░░░▒░░░░░░░░░░░░▒▒░░░░░▒░░░▒░░░▒░░░░░░▒░░░░',
          '░▒░░░░░░░░░░▒▒░░░░░░▒░░░░░░░░░░░░▒▒░░░░░░░░▒░░░░▒░░░░░░░░▒░░░░░▒░░░▒░░░░▒▒░░░░░░▒░░░░░░░░░▒░▒░░░░░░░▒░░▒░░░░░░░▒░░',
          '░░░▒░░░▒░░▒▒▒░░▒░▒░▒░░▒▒▒░░░░░░░░░░▒░▒░▒░░▒░░░░░░░░▒░░▒▒░░░▒░░░░░░░░░░▒░▒░░░▒░░░░░▒░░░░░░░░░▒░░▒▒░░░▒░░░░░░░░░░░░░░',
          '▒░░░░░░░░░░░░░░░░▒▒▒░░░░░▒░░░░░░░░░░░░░░░░░░░░▒░░▒░░░░▒░░░░░▒░░▒▒▒░░░░▒░░░░░░░░▒░░░░░░░░░░░░░░▒░░░░░░▒░░░░░░░▒▒░░░░'
        ];
        var shimmers = document.querySelectorAll('.sk-init-shimmer');
        for (var i = 0; i < shimmers.length; i++) {
          var el = shimmers[i];
          var h = parseInt(el.style.height || '16', 10);
          var rows = Math.max(1, Math.round(h / 12));
          var t = '';
          for (var r = 0; r < rows; r++) {
            t += (r > 0 ? '\n' : '') + glyphRows[(i + r) % glyphRows.length];
          }
          el.textContent = t;
        }
